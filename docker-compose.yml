services:
  web:
    container_name: "django-course"
    build: .
    command: >
      bash -c "python manage.py migrate && python manage.py csu && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - static_volume:/app/static
    ports:
      - "8000:8000"

    depends_on:
      - db
      - redis

  db:
    image: postgres
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:6

  celery:
    build: .
    command: "bash -c 'celery -A config worker --loglevel=info'"
    env_file:
      - .env
    depends_on:
      - redis
      - db

  celery_beat:
    build: .
    env_file:
      - .env
    command: "bash -c 'celery -A config beat --loglevel=info'"
    depends_on:
      - redis
      - db

volumes:
  postgres_data:
  static_volume: